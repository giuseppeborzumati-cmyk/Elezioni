name: Note automatiche Commissione
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/auto-notes-commissione.yml"
      - "scripts/auto_notes_commissione.py"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/auto_notes_commissione.py
      - name: Verifica
        run: |
          grep -q "Confermato dalla Commissione Elettorale tramite pannello digitale" index.html
          grep -q "Data/ora registrata automaticamente dal sistema" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html
          git diff --cached --quiet && exit 0
          git commit -m "Inserisce note automatiche per le conferme di regolarità"
          git push
