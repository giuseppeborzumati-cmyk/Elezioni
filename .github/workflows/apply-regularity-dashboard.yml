name: Integra dashboard regolarità elettorale

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-regularity-dashboard.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Applica controlli di regolarità
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # ---------- BACKEND ----------
          p = Path('functions/index.js')
          t = p.read_text(encoding='utf-8')

          marker = "const yearSuffix = (year) => String(year || '2026/2027').replace('/', '_');"
          constants = r'''const REGULARITY_PRE_VOTE_CONTROLS = Object.freeze([
            'annualCircularRecorded',
            'commissionAppointed',
            'voterRollFinal',
            'candidateListsValidated',
            'ballotApproved',
            'privacyChecked',
            'technicalTestPassed',
            'softwareFrozen',
            'backupPlanReady',
            'incidentPlanReady',
            'communicationPublished'
          ]);
          const REGULARITY_ALL_CONTROLS = new Set([
            ...REGULARITY_PRE_VOTE_CONTROLS,
            'finalArchiveSealed',
            'appealWindowClosed'
          ]);
          const regularityStateRef = (year) => yearlyCollection('regolarita', year).doc('state');
          const regularityAppeals = (year) => yearlyCollection('reclami_ricorsi', year);
          const regularityEvents = (year) => yearlyCollection('eventi_procedimento', year);
          '''
          if 'REGULARITY_PRE_VOTE_CONTROLS' not in t:
              t = t.replace(marker, constants + '\n' + marker, 1)

          helper_marker = 'async function authenticateStaff({ username, password, requestedRole, year }) {'
          helpers = r'''
          function emptyRegularityState() {
            return {
              annualCircularRecorded: false,
              commissionAppointed: false,
              voterRollFinal: false,
              candidateListsValidated: false,
              ballotApproved: false,
              privacyChecked: false,
              technicalTestPassed: false,
              softwareFrozen: false,
              backupPlanReady: false,
              incidentPlanReady: false,
              communicationPublished: false,
              resultsPublished: false,
              appealWindowClosed: false,
              finalArchiveSealed: false,
              legalHold: false,
              procedureClosed: false,
              emergencySuspended: false,
              notes: {}
            };
          }

          async function loadRegularityState(year) {
            const snap = await regularityStateRef(year).get();
            return { ...emptyRegularityState(), ...(snap.exists ? snap.data() : {}) };
          }

          function regularityMissing(state) {
            return REGULARITY_PRE_VOTE_CONTROLS.filter((key) => state[key] !== true);
          }

          function timestampIso(value) {
            if (!value) return null;
            if (typeof value.toDate === 'function') return value.toDate().toISOString();
            const d = value instanceof Date ? value : new Date(value);
            return Number.isNaN(d.getTime()) ? null : d.toISOString();
          }

          function serializeRegularityState(state) {
            const out = { ...state };
            for (const key of ['updatedAt','resultsPublishedAt','procedureClosedAt','lastIncidentAt']) {
              if (out[key]) out[key] = timestampIso(out[key]);
            }
            return out;
          }

          async function assertElectionReadyForVoting(year) {
            const state = await loadRegularityState(year);
            const missing = regularityMissing(state);
            if (state.procedureClosed === true) {
              throw new HttpsError('failed-precondition', 'Procedimento elettorale definitivamente chiuso.');
            }
            if (state.emergencySuspended === true) {
              throw new HttpsError('failed-precondition', 'Votazione sospesa dalla Commissione per evento tecnico/organizzativo verbalizzato.');
            }
            if (missing.length) {
              throw new HttpsError('failed-precondition', `Apertura bloccata: controlli di regolarità incompleti (${missing.join(', ')}).`);
            }
          }
          '''
          if 'function emptyRegularityState()' not in t:
              t = t.replace(helper_marker, helpers + '\n' + helper_marker, 1)

          # Impone il preflight sia alla validazione del token sia al deposito del voto.
          needle = "const config = await loadElectionConfig(year);\n  assertVotingOpen(config);"
          repl = "const config = await loadElectionConfig(year);\n  await assertElectionReadyForVoting(year);\n  assertVotingOpen(config);"
          if t.count(needle) >= 2 and 'await assertElectionReadyForVoting(year);' not in t:
              t = t.replace(needle, repl, 2)

          export_marker = "exports.getSecurityStatus = onCall({ region: REGION }, async (request) => {"
          exports_code = r'''
          exports.getRegularityState = onCall({ region: REGION }, async (request) => {
            requireAuth(request, ['COMMISSIONE','DIRIGENTE','VICEPRESIDE','DSGA','SEGRETERIA']);
            const year = request.data?.annoScolastico;
            const state = await loadRegularityState(year);
            const appealsSnap = await regularityAppeals(year).orderBy('filedAt', 'desc').limit(100).get();
            const appeals = appealsSnap.docs.map((d) => {
              const x = d.data() || {};
              return {
                id: d.id,
                protocolRef: x.protocolRef || '',
                subject: x.subject || '',
                status: x.status || 'OPEN',
                decisionRef: x.decisionRef || '',
                filedAt: timestampIso(x.filedAt),
                decidedAt: timestampIso(x.decidedAt)
              };
            });
            const missing = regularityMissing(state);
            return {
              state: serializeRegularityState(state),
              missing,
              readyForVoting: missing.length === 0 && !state.emergencySuspended && !state.procedureClosed,
              appeals
            };
          });

          exports.setRegularityControl = onCall({ region: REGION }, async (request) => {
            const actor = requireAuth(request, ['COMMISSIONE']);
            const year = request.data?.annoScolastico;
            const control = String(request.data?.control || '');
            const value = request.data?.value === true;
            const note = String(request.data?.note || '').trim().slice(0, 1000);
            if (!REGULARITY_ALL_CONTROLS.has(control)) throw new HttpsError('invalid-argument', 'Controllo non valido.');
            const config = await loadElectionConfig(year);
            const phase = electionPhase(config);
            if (REGULARITY_PRE_VOTE_CONTROLS.includes(control) && phase !== 'BEFORE') {
              throw new HttpsError('failed-precondition', 'I controlli preliminari non sono modificabili dopo l’apertura della finestra elettorale.');
            }
            const ref = regularityStateRef(year);
            await db.runTransaction(async (tx) => {
              const snap = await tx.get(ref);
              const current = { ...emptyRegularityState(), ...(snap.exists ? snap.data() : {}) };
              const notes = { ...(current.notes || {}), [control]: note };
              tx.set(ref, {
                [control]: value,
                notes,
                updatedAt: admin.firestore.FieldValue.serverTimestamp(),
                updatedBy: actor.uid
              }, { merge: true });
            });
            await regularityEvents(year).add({
              type: 'CONTROL_UPDATE', control, value, note,
              actorUid: actor.uid, actorRole: actor.role,
              at: admin.firestore.FieldValue.serverTimestamp()
            });
            await auditAdmin(actor, 'REGULARITY_CONTROL_UPDATE', { control, value });
            return { ok: true };
          });

          exports.recordResultsPublication = onCall({ region: REGION }, async (request) => {
            const actor = requireAuth(request, ['COMMISSIONE']);
            const year = request.data?.annoScolastico;
            const protocolRef = String(request.data?.protocolRef || '').trim().slice(0, 160);
            const appealDeadline = String(request.data?.appealDeadline || '').trim();
            if (!protocolRef || !/^\d{4}-\d{2}-\d{2}$/.test(appealDeadline)) {
              throw new HttpsError('invalid-argument', 'Inserire protocollo/estremi della pubblicazione e termine ricorsi in formato AAAA-MM-GG.');
            }
            const config = await loadElectionConfig(year);
            if (electionPhase(config) === 'OPEN') throw new HttpsError('failed-precondition', 'Non è possibile pubblicare i risultati a urne aperte.');
            await regularityStateRef(year).set({
              resultsPublished: true,
              resultsPublishedAt: admin.firestore.FieldValue.serverTimestamp(),
              resultsPublicationProtocol: protocolRef,
              appealDeadline,
              appealWindowClosed: false,
              legalHold: true,
              updatedAt: admin.firestore.FieldValue.serverTimestamp(),
              updatedBy: actor.uid
            }, { merge: true });
            await regularityEvents(year).add({
              type: 'RESULTS_PUBLICATION', protocolRef, appealDeadline,
              actorUid: actor.uid, at: admin.firestore.FieldValue.serverTimestamp()
            });
            await auditAdmin(actor, 'RESULTS_PUBLICATION_RECORDED', { protocolRef, appealDeadline });
            return { ok: true };
          });

          exports.fileElectoralAppeal = onCall({ region: REGION }, async (request) => {
            const actor = requireAuth(request, ['COMMISSIONE']);
            const year = request.data?.annoScolastico;
            const protocolRef = String(request.data?.protocolRef || '').trim().slice(0, 160);
            const subject = String(request.data?.subject || '').trim().slice(0, 1000);
            if (!protocolRef || !subject) throw new HttpsError('invalid-argument', 'Protocollo e oggetto del reclamo/ricorso sono obbligatori.');
            const ref = regularityAppeals(year).doc();
            await ref.set({
              protocolRef, subject, status: 'OPEN',
              filedAt: admin.firestore.FieldValue.serverTimestamp(),
              createdBy: actor.uid
            });
            await regularityStateRef(year).set({
              legalHold: true,
              appealWindowClosed: false,
              updatedAt: admin.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            await auditAdmin(actor, 'ELECTORAL_APPEAL_FILED', { appealId: ref.id, protocolRef });
            return { ok: true, id: ref.id };
          });

          exports.resolveElectoralAppeal = onCall({ region: REGION }, async (request) => {
            const actor = requireAuth(request, ['COMMISSIONE']);
            const year = request.data?.annoScolastico;
            const id = String(request.data?.id || '').trim();
            const decisionRef = String(request.data?.decisionRef || '').trim().slice(0, 200);
            if (!id || !decisionRef) throw new HttpsError('invalid-argument', 'Ricorso e riferimento della decisione sono obbligatori.');
            const ref = regularityAppeals(year).doc(id);
            const snap = await ref.get();
            if (!snap.exists) throw new HttpsError('not-found', 'Ricorso non trovato.');
            await ref.update({
              status: 'RESOLVED', decisionRef,
              decidedAt: admin.firestore.FieldValue.serverTimestamp(),
              decidedBy: actor.uid
            });
            const open = await regularityAppeals(year).where('status', '==', 'OPEN').limit(1).get();
            if (open.empty) {
              await regularityStateRef(year).set({ updatedAt: admin.firestore.FieldValue.serverTimestamp() }, { merge: true });
            }
            await auditAdmin(actor, 'ELECTORAL_APPEAL_RESOLVED', { appealId: id, decisionRef });
            return { ok: true };
          });

          exports.recordElectoralIncident = onCall({ region: REGION }, async (request) => {
            const actor = requireAuth(request, ['COMMISSIONE']);
            const year = request.data?.annoScolastico;
            const protocolRef = String(request.data?.protocolRef || '').trim().slice(0, 160);
            const title = String(request.data?.title || '').trim().slice(0, 200);
            const details = String(request.data?.details || '').trim().slice(0, 2000);
            const suspend = request.data?.suspend === true;
            if (!title || !details) throw new HttpsError('invalid-argument', 'Titolo e descrizione dell’incidente sono obbligatori.');
            await regularityEvents(year).add({
              type: 'INCIDENT', protocolRef, title, details, suspend,
              actorUid: actor.uid, at: admin.firestore.FieldValue.serverTimestamp()
            });
            await regularityStateRef(year).set({
              emergencySuspended: suspend,
              lastIncidentAt: admin.firestore.FieldValue.serverTimestamp(),
              updatedAt: admin.firestore.FieldValue.serverTimestamp(),
              updatedBy: actor.uid
            }, { merge: true });
            await auditAdmin(actor, 'ELECTORAL_INCIDENT_RECORDED', { protocolRef, title, suspend });
            return { ok: true };
          });

          exports.setEmergencySuspension = onCall({ region: REGION }, async (request) => {
            const actor = requireAuth(request, ['COMMISSIONE']);
            const year = request.data?.annoScolastico;
            const suspended = request.data?.suspended === true;
            const reason = String(request.data?.reason || '').trim().slice(0, 1000);
            if (!reason) throw new HttpsError('invalid-argument', 'La motivazione è obbligatoria.');
            await regularityStateRef(year).set({
              emergencySuspended: suspended,
              suspensionReason: reason,
              updatedAt: admin.firestore.FieldValue.serverTimestamp(),
              updatedBy: actor.uid
            }, { merge: true });
            await regularityEvents(year).add({
              type: suspended ? 'SUSPENSION' : 'RESUMPTION', reason,
              actorUid: actor.uid, at: admin.firestore.FieldValue.serverTimestamp()
            });
            await auditAdmin(actor, suspended ? 'ELECTION_SUSPENDED' : 'ELECTION_RESUMED', {});
            return { ok: true };
          });

          exports.closeElectoralProcedure = onCall({ region: REGION }, async (request) => {
            const actor = requireAuth(request, ['COMMISSIONE']);
            const year = request.data?.annoScolastico;
            const closureRef = String(request.data?.closureRef || '').trim().slice(0, 200);
            if (!closureRef) throw new HttpsError('invalid-argument', 'Estremi del verbale/provvedimento di chiusura obbligatori.');
            const config = await loadElectionConfig(year);
            if (electionPhase(config) === 'OPEN') throw new HttpsError('failed-precondition', 'Le urne risultano ancora aperte.');
            const state = await loadRegularityState(year);
            if (!state.resultsPublished || !state.appealWindowClosed || !state.finalArchiveSealed) {
              throw new HttpsError('failed-precondition', 'Pubblicazione risultati, chiusura termini ricorsi e sigillo fascicolo devono essere completati.');
            }
            const open = await regularityAppeals(year).where('status', '==', 'OPEN').limit(1).get();
            if (!open.empty) throw new HttpsError('failed-precondition', 'Esistono reclami/ricorsi ancora aperti.');

            const accounts = await yearlyCollection('gestione_accessi', year).get();
            let batch = db.batch();
            let count = 0;
            for (const d of accounts.docs) {
              const role = normalize(d.data()?.role);
              if (MANAGEMENT_ROLES.has(role)) {
                batch.update(d.ref, {
                  active: false,
                  closedProcedureRevocationAt: admin.firestore.FieldValue.serverTimestamp(),
                  closedProcedureRevocationRef: closureRef
                });
                count++;
                if (count % 400 === 0) { await batch.commit(); batch = db.batch(); }
              }
            }
            if (count % 400 !== 0) await batch.commit();
            await regularityStateRef(year).set({
              procedureClosed: true,
              procedureClosedAt: admin.firestore.FieldValue.serverTimestamp(),
              closureRef,
              legalHold: false,
              emergencySuspended: false,
              updatedAt: admin.firestore.FieldValue.serverTimestamp(),
              updatedBy: actor.uid
            }, { merge: true });
            await regularityEvents(year).add({
              type: 'PROCEDURE_CLOSED', closureRef, revokedManagementAccounts: count,
              actorUid: actor.uid, at: admin.firestore.FieldValue.serverTimestamp()
            });
            await auditAdmin(actor, 'ELECTORAL_PROCEDURE_CLOSED', { closureRef, revokedManagementAccounts: count });
            return { ok: true, revokedManagementAccounts: count };
          });
          '''
          if 'exports.getRegularityState' not in t:
              t = t.replace(export_marker, exports_code + '\n' + export_marker, 1)

          p.write_text(t, encoding='utf-8')

          # ---------- FRONTEND ----------
          p = Path('index.html')
          h = p.read_text(encoding='utf-8')
          if "getRegularityState: httpsCallable" not in h:
              h = h.replace(
                  "getSecurityStatus: httpsCallable(functions, 'getSecurityStatus'),",
                  "getSecurityStatus: httpsCallable(functions, 'getSecurityStatus'),\n            getRegularityState: httpsCallable(functions, 'getRegularityState'),\n            setRegularityControl: httpsCallable(functions, 'setRegularityControl'),\n            recordResultsPublication: httpsCallable(functions, 'recordResultsPublication'),\n            fileElectoralAppeal: httpsCallable(functions, 'fileElectoralAppeal'),\n            resolveElectoralAppeal: httpsCallable(functions, 'resolveElectoralAppeal'),\n            recordElectoralIncident: httpsCallable(functions, 'recordElectoralIncident'),\n            setEmergencySuspension: httpsCallable(functions, 'setEmergencySuspension'),\n            closeElectoralProcedure: httpsCallable(functions, 'closeElectoralProcedure'),",
                  1
              )

          if "id: 'regolarita'" not in h:
              h = h.replace(
                  "{ id: 'workflow_digitale', label: '11. Workflow Digitale & Verbali' }",
                  "{ id: 'workflow_digitale', label: '11. Workflow Digitale & Verbali' },\n                { id: 'regolarita', label: '12. Regolarità Elettorale' }",
                  1
              )
              h = h.replace(
                  "else if(activeAdminTab === 'workflow_digitale') renderDigitalWorkflowTab(content);",
                  "else if(activeAdminTab === 'workflow_digitale') renderDigitalWorkflowTab(content);\n            else if(activeAdminTab === 'regolarita') renderRegularityTab(content);",
                  1
              )

          renderer_marker = '        async function renderDigitalWorkflowTab(container) {'
          renderer = r'''
        const REGULARITY_LABELS = Object.freeze({
            annualCircularRecorded:'Circolare MIM/USR annuale acquisita e protocollata',
            commissionAppointed:'Commissione elettorale formalmente nominata',
            voterRollFinal:'Elenchi elettorali definitivi e reclami sugli elenchi conclusi',
            candidateListsValidated:'Liste e candidature convalidate',
            ballotApproved:'Scheda elettorale approvata e congelata',
            privacyChecked:'Privacy/GDPR, informative, ruoli e minimizzazione verificati',
            technicalTestPassed:'Collaudo tecnico verbalizzato e superato',
            softwareFrozen:'Versione software/commit congelata per la consultazione',
            backupPlanReady:'Backup e ripristino verificati',
            incidentPlanReady:'Piano incidenti/sospensione/ripresa approvato',
            communicationPublished:'Convocazioni, istruzioni e comunicazioni agli elettori pubblicate',
            finalArchiveSealed:'Fascicolo finale sigillato con verbali/hash/evidenze',
            appealWindowClosed:'Termine reclami/ricorsi concluso e verificato'
        });

        async function renderRegularityTab(container) {
            container.innerHTML = `<div class="w-full bg-white rounded-3xl shadow border border-slate-200 p-6"><div class="flex items-center gap-3"><div class="spinner !border-slate-200 !border-t-blue-900"></div><b class="text-sm">Verifica regolarità del procedimento...</b></div></div>`;
            try {
                const r = await SECURE_API.getRegularityState({annoScolastico:configElezioni.annoScolastico});
                const s = r.data?.state || {};
                const appeals = r.data?.appeals || [];
                const ready = r.data?.readyForVoting === true;
                const missing = r.data?.missing || [];
                const preKeys = Object.keys(REGULARITY_LABELS).filter(k=>!['finalArchiveSealed','appealWindowClosed'].includes(k));
                const checkCard = (k) => `<div class="p-3 rounded-2xl border ${s[k]?'bg-emerald-50 border-emerald-200':'bg-red-50 border-red-200'}"><div class="flex justify-between gap-3"><div><b class="text-[11px] ${s[k]?'text-emerald-900':'text-red-900'}">${s[k]?'✓':'✕'} ${REGULARITY_LABELS[k]}</b><div class="text-[9px] text-slate-500 mt-1">${s.notes?.[k]||'Nessuna annotazione registrata.'}</div></div><button onclick="window.toggleRegularityControl('${k}',${!s[k]})" class="shrink-0 px-2 py-1 rounded-lg text-[9px] font-black ${s[k]?'bg-slate-200 text-slate-700':'bg-emerald-700 text-white'}">${s[k]?'Revoca':'Conferma'}</button></div></div>`;
                const appealRows = appeals.map(a=>`<tr class="border-t"><td class="p-2 font-mono">${a.protocolRef||'—'}</td><td class="p-2">${a.subject||'—'}</td><td class="p-2 font-black ${a.status==='OPEN'?'text-red-700':'text-emerald-700'}">${a.status}</td><td class="p-2">${a.decisionRef||'—'}</td><td class="p-2">${a.status==='OPEN'?`<button onclick="window.resolveRegularityAppeal('${a.id}')" class="px-2 py-1 bg-emerald-700 text-white rounded-lg font-black">Registra decisione</button>`:'Definito'}</td></tr>`).join('');
                container.innerHTML = `
                <div class="w-full space-y-5 animate-fade-in font-semibold">
                  <div class="bg-white rounded-3xl shadow border border-slate-200 p-6">
                    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4"><div><span class="text-[9px] bg-blue-900 text-white px-2 py-1 rounded font-black uppercase">Controllo procedimentale</span><h3 class="text-xl font-black text-slate-900 mt-2">Regolarità elettorale — A.S. ${configElezioni.annoScolastico}</h3><p class="text-[10px] text-slate-500 mt-1">O.M. 215/1991 e s.m.i. + circolare annuale MIM/USR + Nota MIM 3803/2026 e Allegato tecnico + GDPR/CAD/AgID. I controlli tecnici non sostituiscono gli atti formali della scuola.</p></div><div class="px-4 py-3 rounded-2xl ${ready?'bg-emerald-100 text-emerald-900':'bg-red-100 text-red-900'}"><div class="text-[9px] uppercase font-black">Apertura tecnica</div><div class="text-lg font-black">${ready?'ABILITATA':'BLOCCATA'}</div></div></div>
                    ${missing.length?`<div class="mt-4 p-3 rounded-xl bg-red-50 border border-red-200 text-[10px] text-red-900"><b>Controlli bloccanti mancanti:</b> ${missing.map(k=>REGULARITY_LABELS[k]||k).join(' · ')}</div>`:'<div class="mt-4 p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-[10px] text-emerald-900"><b>Preflight completo.</b> Il backend consentirà il voto solo all’interno della finestra temporale configurata.</div>'}
                    <div class="mt-5 grid md:grid-cols-2 gap-3">${preKeys.map(checkCard).join('')}</div>
                    <div class="mt-4 bg-blue-50 border border-blue-100 rounded-2xl p-3 text-[10px]"><b>Annotazione per il prossimo controllo:</b><input id="regularityNote" placeholder="Estremi protocollo, verbale, delibera o breve motivazione" class="mt-2 w-full p-2.5 rounded-xl border bg-white"></div>
                  </div>

                  <div class="grid lg:grid-cols-2 gap-5">
                    <div class="bg-white rounded-3xl shadow border p-5 space-y-3"><h4 class="font-black text-sm">Pubblicazione risultati e termine ricorsi</h4><div class="grid sm:grid-cols-2 gap-2"><input id="regPubProtocol" placeholder="Protocollo/estremi pubblicazione" class="p-2.5 border rounded-xl text-xs"><input id="regAppealDeadline" type="date" class="p-2.5 border rounded-xl text-xs"></div><button onclick="window.recordRegularityPublication()" class="w-full py-2.5 bg-blue-900 text-white rounded-xl text-xs font-black">Registra pubblicazione ufficiale</button><div class="text-[10px] text-slate-500">Stato: <b>${s.resultsPublished?'PUBBLICATI':'NON REGISTRATI'}</b>${s.resultsPublicationProtocol?` · ${s.resultsPublicationProtocol}`:''}${s.appealDeadline?` · termine registrato ${s.appealDeadline}`:''}</div></div>
                    <div class="bg-white rounded-3xl shadow border p-5 space-y-3"><h4 class="font-black text-sm">Incidente / sospensione</h4><input id="regIncidentTitle" placeholder="Titolo incidente" class="w-full p-2.5 border rounded-xl text-xs"><input id="regIncidentProtocol" placeholder="Protocollo/verbale (se disponibile)" class="w-full p-2.5 border rounded-xl text-xs"><textarea id="regIncidentDetails" placeholder="Descrizione, impatto, decisione adottata" class="w-full p-2.5 border rounded-xl text-xs"></textarea><label class="flex items-center gap-2 text-[10px]"><input id="regIncidentSuspend" type="checkbox"> Sospendi immediatamente nuovi accessi al voto</label><button onclick="window.recordRegularityIncident()" class="w-full py-2.5 bg-amber-600 text-white rounded-xl text-xs font-black">Registra incidente</button><button onclick="window.resumeRegularityElection()" class="w-full py-2 bg-slate-100 rounded-xl text-[10px] font-black">Registra ripresa della votazione</button><div class="text-[10px] ${s.emergencySuspended?'text-red-700':'text-emerald-700'} font-black">${s.emergencySuspended?'VOTAZIONE SOSPESA':'Nessuna sospensione attiva'}</div></div>
                  </div>

