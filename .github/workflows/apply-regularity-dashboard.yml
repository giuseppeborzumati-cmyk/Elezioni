            catch(e){ showNotification('Ricorso non registrato',e.message||'Errore.','error'); }
        };
        window.resolveRegularityAppeal = async function(id){
            const decisionRef = prompt('Inserire protocollo/estremi della decisione della Commissione elettorale:'); if(!decisionRef) return;
            try { await SECURE_API.resolveElectoralAppeal({annoScolastico:configElezioni.annoScolastico,id,decisionRef}); renderActiveAdminTab(); }
            catch(e){ showNotification('Decisione non registrata',e.message||'Errore.','error'); }
        };
        window.recordRegularityIncident = async function(){
            try { await SECURE_API.recordElectoralIncident({annoScolastico:configElezioni.annoScolastico,title:document.getElementById('regIncidentTitle').value.trim(),protocolRef:document.getElementById('regIncidentProtocol').value.trim(),details:document.getElementById('regIncidentDetails').value.trim(),suspend:document.getElementById('regIncidentSuspend').checked}); renderActiveAdminTab(); }
            catch(e){ showNotification('Incidente non registrato',e.message||'Errore.','error'); }
        };
        window.resumeRegularityElection = async function(){
            const reason=prompt('Motivazione e riferimento del verbale che autorizza la ripresa:'); if(!reason)return;
            try { await SECURE_API.setEmergencySuspension({annoScolastico:configElezioni.annoScolastico,suspended:false,reason}); renderActiveAdminTab(); }
            catch(e){ showNotification('Ripresa non registrata',e.message||'Errore.','error'); }
        };
        window.closeRegularityProcedure = async function(){
            const closureRef=document.getElementById('regClosureRef').value.trim(); if(!closureRef)return showNotification('Dato mancante','Inserire gli estremi del verbale/provvedimento di chiusura.','error');
            if(!confirm('Confermare la chiusura definitiva? Gli accessi gestionali dell’anno saranno revocati.'))return;
            try { const r=await SECURE_API.closeElectoralProcedure({annoScolastico:configElezioni.annoScolastico,closureRef}); showNotification('Procedimento chiuso',`Accessi gestionali revocati: ${r.data?.revokedManagementAccounts||0}.`,'success'); renderActiveAdminTab(); }
            catch(e){ showNotification('Chiusura non consentita',e.message||'Verificare ricorsi e fascicolo.','error'); }
        };
