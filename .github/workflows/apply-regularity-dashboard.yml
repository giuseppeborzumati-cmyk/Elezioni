          Path('docs/14_REGOLARITA_PROCEDIMENTO_ELETTORALE.md').write_text(r'''# 14 — Regolarità del procedimento elettorale

## Finalità
Questa sezione documenta i controlli tecnico-organizzativi inseriti nella piattaforma per rendere verificabile l'intero procedimento. Non sostituisce l'O.M. 215/1991 e s.m.i., la circolare MIM/USR annuale, gli atti della Commissione elettorale, il regolamento d'Istituto, le valutazioni privacy/DPO o la conservazione documentale dell'Istituto.

## Controlli bloccanti prima del voto
La piattaforma impedisce il rilascio di una sessione di voto e il deposito della scheda se non risultano confermati:
1. circolare MIM/USR annuale acquisita e protocollata;
2. Commissione elettorale formalmente nominata;
3. elenchi elettorali definitivi e relativa fase reclami conclusa;
4. liste e candidature convalidate;
5. scheda approvata e congelata;
6. verifica privacy/GDPR e minimizzazione;
7. collaudo tecnico verbalizzato;
8. versione software congelata;
9. piano di backup/ripristino;
10. piano incidenti/sospensione/ripresa;
11. comunicazioni agli elettori effettuate.

## Dopo il voto
- registrazione server-side della pubblicazione dei risultati e del termine applicabile ai reclami/ricorsi;
- registro reclami/ricorsi con solo gli estremi necessari (protocollo, oggetto, stato, decisione), evitando dati personali eccedenti;
- legal hold automatico in presenza della fase ricorsi;
- registro incidenti e sospensioni/riprese;
- sigillo del fascicolo finale;
- chiusura definitiva solo dopo definizione dei ricorsi;
- revoca automatica degli account Dirigente, Vicepreside, DSGA e Segreteria alla chiusura definitiva.

## Principio di separazione
La cessazione degli accessi operativi non equivale alla cancellazione degli atti: verbali, risultati, decisioni e documenti soggetti a conservazione seguono le regole documentali dell'Istituto e le Linee guida AgID. La piattaforma separa quindi gestione operativa, eventuale legal hold e conservazione.

## Evidenze
Ogni variazione dei controlli, pubblicazione, ricorso, decisione, incidente, sospensione, ripresa e chiusura produce un evento server-side e un audit amministrativo. Nessun evento di audit deve contenere preferenze di voto, token di voto o altri elementi idonei a correlare elettore e scheda.

## Nota sui ricorsi
La piattaforma registra e supporta i termini previsti dalla normativa elettorale applicabile, ma la determinazione formale del termine concreto deve essere verificata dalla Commissione sulla base dell'O.M. 215/1991 e della circolare MIM/USR dell'anno scolastico.
''', encoding='utf-8')
