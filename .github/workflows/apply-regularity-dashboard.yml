        window.toggleRegularityControl = async function(control,value) {
            const note = document.getElementById('regularityNote')?.value?.trim() || '';
            try { await SECURE_API.setRegularityControl({annoScolastico:configElezioni.annoScolastico,control,value,note}); renderActiveAdminTab(); }
            catch(e){ showNotification('Controllo non aggiornato',e.message||'Operazione non consentita.','error'); }
        };
        window.recordRegularityPublication = async function(){
            try { await SECURE_API.recordResultsPublication({annoScolastico:configElezioni.annoScolastico,protocolRef:document.getElementById('regPubProtocol').value.trim(),appealDeadline:document.getElementById('regAppealDeadline').value}); renderActiveAdminTab(); }
            catch(e){ showNotification('Pubblicazione non registrata',e.message||'Errore.','error'); }
