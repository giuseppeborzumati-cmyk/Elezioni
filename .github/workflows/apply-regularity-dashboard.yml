name: Integra dashboard regolarità elettorale

on:
  push:
    branches: ["main"]
    paths:
      - ".github/scripts/apply_regularity.py"
      - ".github/workflows/apply-regularity-dashboard.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Applica modifiche
        run: python3 .github/scripts/apply_regularity.py
      - name: Verifica sintassi backend
        run: node --check functions/index.js
      - name: Verifica sintassi frontend
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*type="module"[^>]*>(.*?)</script>',s,re.S)
          if not blocks: raise SystemExit('Modulo JS non trovato')
          Path('/tmp/frontend.mjs').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/frontend.mjs
          grep -q "Regolarità Elettorale" index.html
          grep -q "assertElectionReadyForVoting" functions/index.js
      - name: Commit su main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html functions/index.js docs/14_REGOLARITA_PROCEDIMENTO_ELETTORALE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integra controlli bloccanti di regolarità elettorale"
          git push origin main
