                  <div class="bg-white rounded-3xl shadow border p-5"><h4 class="font-black text-sm">Chiusura definitiva e conservazione</h4><p class="text-[10px] text-slate-500 mt-1">Prima della chiusura devono risultare: risultati pubblicati, termine reclami/ricorsi concluso, nessun ricorso aperto e fascicolo finale sigillato. La chiusura revoca automaticamente Dirigente, Vicepreside, DSGA e Segreteria per questo anno scolastico.</p><div class="grid md:grid-cols-2 gap-3 mt-4">${checkCard('appealWindowClosed')}${checkCard('finalArchiveSealed')}</div><div class="mt-3 flex gap-2"><input id="regClosureRef" placeholder="Estremi verbale/provvedimento di chiusura" class="flex-1 p-2.5 border rounded-xl text-xs"><button onclick="window.closeRegularityProcedure()" class="px-4 bg-slate-900 text-white rounded-xl text-xs font-black ${s.procedureClosed?'opacity-50':''}" ${s.procedureClosed?'disabled':''}>${s.procedureClosed?'PROCEDIMENTO CHIUSO':'Chiudi definitivamente'}</button></div>${s.procedureClosed?`<div class="mt-3 p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-[10px] text-emerald-900"><b>Procedimento definitivamente chiuso.</b> ${s.closureRef||''}</div>`:''}</div>
                </div>`;
