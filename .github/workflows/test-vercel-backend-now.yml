name: Collaudo backend Vercel

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/test-vercel-backend-now.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Attendi backend e verifica Firebase
        shell: bash
        run: |
          set -euo pipefail
          URL="https://elezioni-primo-levi-vercel.vercel.app/api/health"
          ok=0
          for i in $(seq 1 24); do
            code=$(curl -sS --max-time 15 -o /tmp/health.json -w '%{http_code}' "$URL" || true)
            echo "Tentativo $i: HTTP $code"
            if [ "$code" = "200" ] && jq -e '.ok == true and .firebase == true and .commissionAccount == true and .authTokenMinting == true and .commissionLoginHandler == true' /tmp/health.json >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 5
          done
          cat /tmp/health.json || true
          test "$ok" = "1"

      - name: Verifica CORS per GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          headers=$(curl -sS -i --max-time 15 -X OPTIONS \
            -H 'Origin: https://giuseppeborzumati-cmyk.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,authorization' \
            https://elezioni-primo-levi-vercel.vercel.app/api/call)
          printf '%s\n' "$headers"
          echo "$headers" | grep -qi '^HTTP/.* 204'
          echo "$headers" | grep -qi '^access-control-allow-origin: https://giuseppeborzumati-cmyk.github.io'

      - name: Verifica handler login senza usare credenziali reali
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /tmp/login.json -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://giuseppeborzumati-cmyk.github.io' \
            --data '{"name":"commissionLogin","data":{"username":"__healthcheck_invalid__","password":"not-a-real-password","annoScolastico":"2026/2027"}}' \
            https://elezioni-primo-levi-vercel.vercel.app/api/call)
          cat /tmp/login.json
          test "$code" = "403"
          jq -e '.error.code == "permission-denied"' /tmp/login.json >/dev/null
