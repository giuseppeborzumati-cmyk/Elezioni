name: Applica scadenza credenziali gestionali

on:
  push:
    branches: ["main"]
    paths:
      - ".github/expiry.patch.gz.b64"
      - ".github/workflows/apply-credential-expiry.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Applica modifica e verifica
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/expiry.patch.gz.b64 ]; then
            echo "Patch già applicata."
            exit 0
          fi
          base64 --decode .github/expiry.patch.gz.b64 | gzip -d > /tmp/expiry.patch
          git apply --check /tmp/expiry.patch
          git apply /tmp/expiry.patch
          cp index.html 404.html
          node --check functions/index.js
          node --check functions/scripts/provision-account.js
          grep -q "getStaffAccounts" index.html
          grep -q "managementCredentialExpiry" functions/index.js
          grep -q "staffExpiresAt" functions/index.js
      - name: Commit su main
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/expiry.patch.gz.b64 ]; then exit 0; fi
          git rm .github/expiry.patch.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html functions/index.js functions/scripts/provision-account.js docs/04_POLICY_ACCESSI_RUOLI.md
          git commit -m "Aggiunge scadenza automatica credenziali gestionali"
          git push origin main
