name: Correggi messaggio accesso Commissione

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-auth-error-message.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correggi messaggio autenticazione
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old="""            } catch (e) {
                showNotification('Accesso negato','Credenziali non valide o servizio di autenticazione non disponibile.','error');
            }
"""
          new="""            } catch (e) {
                const authCode = String(e?.code || '');
                const authMsg = String(e?.message || '');
                const serviceUnavailable = /unavailable|internal|not-found|network-request-failed/i.test(authCode) || /failed to fetch|network|cors|service unavailable/i.test(authMsg);
                showNotification(
                    serviceUnavailable ? 'Servizio Commissione non disponibile' : 'Accesso negato',
                    serviceUnavailable ? 'Il servizio di autenticazione Commissione non è ancora raggiungibile. È necessario completare il deploy Firebase Functions.' : 'Username o password non validi.',
                    'error'
                );
            }
"""
          for name in ('index.html','404.html'):
              p=Path(name)
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f'Blocco non trovato in {name}')
              p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html
          git commit -m "Distingui credenziali errate da backend non disponibile"
          git push
