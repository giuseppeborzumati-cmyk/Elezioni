name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "404.html"
      - "vendor/**"
      - "*.png"
      - "*.jpg"
      - "*.jpeg"
      - "*.webp"
      - "*.svg"
      - "*.ico"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara solo i file pubblici del frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html 404.html .nojekyll _site/
          cp -R vendor _site/vendor
          find . -maxdepth 1 -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' -o -name '*.svg' -o -name '*.ico' \) -exec cp {} _site/ \;
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Pubblica GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
