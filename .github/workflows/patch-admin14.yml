name: Aggiorna Firebase Admin 14

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-admin14.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Aggiorna API modulari
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('functions/index.js')
          s=p.read_text()
          replacements={
            "const admin = require('firebase-admin');":"const { initializeApp } = require('firebase-admin/app');\nconst { getFirestore, FieldValue, Timestamp } = require('firebase-admin/firestore');\nconst { getAuth } = require('firebase-admin/auth');",
            "admin.initializeApp();":"initializeApp();",
            "const db = admin.firestore();":"const db = getFirestore();",
            "admin.firestore.FieldValue.serverTimestamp()":"FieldValue.serverTimestamp()",
            "admin.firestore.FieldValue.delete()":"FieldValue.delete()",
            "admin.firestore.Timestamp.fromDate(":"Timestamp.fromDate(",
            "admin.firestore.Timestamp.fromMillis(":"Timestamp.fromMillis(",
            "admin.auth().createCustomToken(":"getAuth().createCustomToken("
          }
          for old,new in replacements.items():
              s=s.replace(old,new)
          if 'admin.' in s:
              raise SystemExit('Sono rimaste chiamate admin.* da migrare')
          p.write_text(s)
          PY
      - name: Installa dipendenze e verifica backend
        run: |
          npm install --prefix functions
          npm run check --prefix functions
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/index.js
          git commit -m "Aggiorna backend a Firebase Admin SDK modulare" || exit 0
          git push
