name: Prepara migrazione Firebase votazioni-levi
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/migrate-firebase-votazioni-levi.yml"
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: firebase-votazioni-levi-migration
          fetch-depth: 0
      - name: Aggiorna configurazione Firebase frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = '''        const firebaseConfig = {
              apiKey: "AIzaSyBDXldnedqfjaihDFXvFixO5KZZNP5SkdE",
              authDomain: "mio-sistema-voto.firebaseapp.com",
              projectId: "mio-sistema-voto",
              storageBucket: "mio-sistema-voto.firebasestorage.app",
              messagingSenderId: "188743609131",
              appId: "1:188743609131:web:da7666758444a40be3336e"
          };'''
          new = '''        const firebaseConfig = {
              apiKey: "AIzaSyDNdRz4Abowmh0Fx91oHt4A5IB1JyNRCkA",
              authDomain: "votazioni-levi.firebaseapp.com",
              projectId: "votazioni-levi",
              storageBucket: "votazioni-levi.firebasestorage.app",
              messagingSenderId: "36801299062",
              appId: "1:36801299062:web:d29c94bb8a9f33c82a5557",
              measurementId: "G-KYGPC6ZLTJ"
          };'''
          for fn in ("index.html", "404.html"):
              p=Path(fn)
              s=p.read_text(encoding="utf-8")
              if old not in s:
                  raise SystemExit(f"Configurazione Firebase precedente non trovata in {fn}")
              p.write_text(s.replace(old,new,1),encoding="utf-8")
          PY
      - name: Verifica
        run: |
          grep -q 'projectId: "votazioni-levi"' index.html
          grep -q 'measurementId: "G-KYGPC6ZLTJ"' index.html
          grep -q 'projectId: "votazioni-levi"' 404.html
      - name: Commit sulla branch di migrazione
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html
          git diff --cached --quiet && exit 0
          git commit -m "Prepara frontend per Firebase votazioni-levi"
          git push origin HEAD:firebase-votazioni-levi-migration
