name: Test backend Vercel corrente

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/test-vercel-current.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica health e API
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://elezioni-primo-levi-vercel.vercel.app'
          echo '=== HEALTH ==='
          code=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$BASE/api/health")
          echo "HTTP $code"
          cat /tmp/health.json
          echo
          test "$code" = "200"
          jq -e '.ok == true and .backend == true and .firebase == true' /tmp/health.json >/dev/null

          echo '=== CALL INVALID LOGIN ==='
          code=$(curl -sS --max-time 20 -o /tmp/call.json -w '%{http_code}' \
            -X POST "$BASE/api/call" \
            -H 'Content-Type: application/json' \
            --data '{"name":"commissionLogin","data":{"username":"__invalid_test__","password":"invalid","annoScolastico":"2026/2027"}}')
          echo "HTTP $code"
          cat /tmp/call.json
          echo
          test "$code" = "403"
          jq -e '.error.code == "permission-denied"' /tmp/call.json >/dev/null

          echo 'VERCEL_BACKEND_OK'
