name: Diagnosi Vercel puntuale

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/diagnose-vercel-now.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Leggi stato alias Vercel effettivo
        shell: bash
        run: |
          set +e
          BASE='https://elezioni-primo-levi-vercel-giuseppeborzumati-2630.vercel.app'
          echo "=== HEALTH ALIAS EFFETTIVO ==="
          curl -sS -i --max-time 20 "$BASE/api/health"
          echo
          echo "=== ROOT ALIAS EFFETTIVO ==="
          curl -sS -i --max-time 20 "$BASE/" | head -n 30
          exit 0
