name: Verifica votazioni-levi Vercel
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/check-votazioni-levi.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica dominio e API
        run: |
          set -e
          BASE="https://votazioni-levi.vercel.app"
          echo "=== ROOT ==="
          curl -sS -I --max-time 15 "$BASE/" | head -n 20
          echo "=== HEALTH ==="
          HTTP=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 20 "$BASE/api/health" || true)
          echo "HTTP=$HTTP"
          cat /tmp/health.json || true
          echo
          echo "=== CORS PRE-FLIGHT ==="
          curl -sS -D - -o /dev/null -X OPTIONS "$BASE/api/call" \
            -H "Origin: https://giuseppeborzumati-cmyk.github.io" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,authorization" | head -n 30
          echo "=== API TEST ==="
          APIHTTP=$(curl -sS -o /tmp/api.json -w "%{http_code}" --max-time 20 \
            -X POST "$BASE/api/call" \
            -H "Content-Type: application/json" \
            -H "Origin: https://giuseppeborzumati-cmyk.github.io" \
            --data '{"name":"commissionLogin","data":{"username":"__test__","password":"__test__","annoScolastico":"2026/2027"}}' || true)
          echo "APIHTTP=$APIHTTP"
          cat /tmp/api.json || true
          echo
          test "$HTTP" = "200"
          grep -q '"ok":true' /tmp/health.json
          test "$APIHTTP" = "403"
          grep -q 'permission-denied' /tmp/api.json
          echo "VOTAZIONI_LEVI_OK"
