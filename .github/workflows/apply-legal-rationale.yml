name: Inserisce motivazione normativa scadenza credenziali

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-legal-rationale.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aggiorna index e 404
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old = '''<div class="mt-5 bg-amber-50 border border-amber-200 rounded-2xl p-4 text-[10px] text-amber-950"><b>Nota di sicurezza:</b> gli account gestionali sono autenticati e autorizzati lato server; le password non sono salvate in chiaro, le operazioni privilegiate sono sottoposte ad audit e ogni credenziale scade automaticamente al 31 agosto dell'anno scolastico di riferimento.</div>'''
          new = '''<div class="mt-5 bg-amber-50 border border-amber-200 rounded-2xl p-4 text-[10px] text-amber-950"><b>Nota di sicurezza:</b> gli account gestionali sono autenticati e autorizzati lato server; le password non sono salvate in chiaro, le operazioni privilegiate sono sottoposte ad audit e ogni credenziale scade automaticamente al 31 agosto dell'anno scolastico di riferimento.<div class="mt-3 pt-3 border-t border-amber-200"><b>Motivazione normativa e organizzativa della scadenza:</b> l'O.M. 215/1991 disciplina la conclusione del procedimento elettorale prevedendo la proclamazione degli eletti e, all'art. 46, un termine di 5 giorni per i ricorsi contro i risultati e ulteriori 5 giorni per la relativa decisione; l'art. 48 collega la prima convocazione alla definizione degli eventuali ricorsi. La Nota MIM prot. 3803 del 30 giugno 2026 e il relativo Allegato tecnico rafforzano, per la gestione digitale del voto, i requisiti di controllo degli accessi, sicurezza, protezione dei dati e conservazione documentale. In coerenza anche con gli artt. 5 e 32 GDPR, una volta conclusa la consultazione, definita la fase dei reclami/ricorsi e completati gli adempimenti conclusivi, gli accessi operativi non devono restare attivi oltre il tempo necessario. La conservazione degli atti elettorali prosegue secondo le regole documentali applicabili, ma non richiede il mantenimento di credenziali operative attive. La scadenza riduce quindi il rischio di accessi successivi non più giustificati, applica il principio del minimo privilegio e separa la fase di gestione dalla successiva conservazione.</div></div>'''
          for name in ('index.html','404.html'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Testo sorgente non trovato in {name}')
              text2 = text.replace(old, new, 1)
              p.write_text(text2, encoding='utf-8')
          PY
          grep -q "Motivazione normativa e organizzativa della scadenza" index.html
      - name: Commit modifica
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html
          git commit -m "Aggiunge motivazione normativa alla scadenza credenziali"
          git push origin main
