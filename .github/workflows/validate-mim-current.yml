name: Verifica hardening MIM corrente

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/validate-mim-current.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica HTML e JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>', start)
          Path('/tmp/election-module.mjs').write_text(s[start:end], encoding='utf-8')
          assert 'RIENTRA NELLA CABINA PROTETTA' in s
          assert 'Gate MIM 2026' in s
          assert 'bloccaSmartphoneReali: true' in s
          assert 'Modalità reale BLOCCATA' in s
          assert "default-src 'self';" in s
          assert 'cdn.tailwindcss.com' not in s
          assert 'cdnjs.cloudflare.com' not in s
          assert 'unpkg.com' not in s
          assert 'Segretezza e separazione identità/voto verificate lato server' not in s
          assert Path('404.html').read_bytes() == Path('index.html').read_bytes()
          print('HTML_HARDENING_OK')
          PY
          node --check /tmp/election-module.mjs
      - name: Verifica backend pubblico
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' https://elezioni-primo-levi-vercel.vercel.app/api/health)
          cat /tmp/health.json
          test "$code" = "200"
          jq -e '.ok == true and .backend == true and .firebase == true' /tmp/health.json >/dev/null
          echo VERCEL_HEALTH_OK
