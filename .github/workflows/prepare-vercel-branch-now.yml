name: Prepara ramo Vercel adesso

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-vercel-branch-now.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vercel-backend
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Applica patch Vercel
        run: python scripts/patch_vercel_backend.py
      - name: Verifica backend
        run: |
          npm install
          npm install --prefix functions
          npm run check --prefix functions
          node --check api/call.js
      - name: Salva sul ramo Vercel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/index.js index.html 404.html
          git commit -m "Adatta piattaforma al backend Vercel" || exit 0
          git push origin HEAD:vercel-backend
