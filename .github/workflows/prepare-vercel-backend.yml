name: Prepara backend Vercel

on:
  push:
    branches: ["vercel-backend"]
    paths:
      - ".github/workflows/prepare-vercel-backend.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vercel-backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Adatta Firebase Admin e frontend a Vercel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('functions/index.js')
          s = p.read_text()
          s = s.replace(
              "const { initializeApp } = require('firebase-admin/app');",
              "const { initializeApp, cert, getApps } = require('firebase-admin/app');"
          )
          s = s.replace(
              "initializeApp();\nconst db = getFirestore();",
              "const rawServiceAccount = process.env.FIREBASE_SERVICE_ACCOUNT_JSON;\n"
              "if (!getApps().length) {\n"
              "  if (rawServiceAccount) {\n"
              "    const serviceAccount = JSON.parse(rawServiceAccount);\n"
              "    initializeApp({ credential: cert(serviceAccount), projectId: serviceAccount.project_id });\n"
              "  } else {\n"
              "    initializeApp();\n"
              "  }\n"
              "}\n"
              "const db = getFirestore();"
          )
          p.write_text(s)

          proxy = r'''        // Backend server-side eseguito su Vercel: nessun segreto nel browser.
        const SECURE_API = new Proxy({}, {
            get: (_, functionName) => async (data = {}) => {
                const headers = { 'Content-Type': 'application/json' };
                if (auth.currentUser) {
                    const idToken = await auth.currentUser.getIdToken();
                    headers.Authorization = `Bearer ${idToken}`;
                }
                let response;
                try {
                    response = await fetch('/api/call', {
                        method: 'POST',
                        headers,
                        cache: 'no-store',
                        body: JSON.stringify({ name: String(functionName), data })
                    });
                } catch (_) {
                    const err = new Error('Servizio di autenticazione non raggiungibile.');
                    err.code = 'unavailable';
                    throw err;
                }
                let payload = {};
                try { payload = await response.json(); } catch (_) {}
                if (!response.ok || payload.error) {
                    const err = new Error(payload?.error?.message || 'Operazione non completata.');
                    err.code = payload?.error?.code || (response.status === 401 ? 'unauthenticated' : 'internal');
                    throw err;
                }
                return { data: payload.data };
            }
        });'''

          pattern = re.compile(r"\s*// Nessun segreto amministrativo è incorporato nel browser\.\s*\n\s*const SECURE_API = Object\.freeze\(\{.*?\n\s*\}\);", re.S)
          for name in ('index.html', '404.html'):
              f = Path(name)
              text = f.read_text()
              updated, count = pattern.subn('\n' + proxy, text, count=1)
              if count != 1:
                  raise SystemExit(f'Blocco SECURE_API non trovato in {name}')
              f.write_text(updated)
          PY
      - name: Verifica sintassi backend
        run: |
          npm install
          npm install --prefix functions
          npm run check --prefix functions
          node --check api/call.js
      - name: Commit modifiche Vercel
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/index.js index.html 404.html
          git commit -m "Adatta piattaforma al backend Vercel" || exit 0
          git push origin HEAD:vercel-backend
