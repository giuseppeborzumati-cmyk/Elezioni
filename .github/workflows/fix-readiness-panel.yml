name: Correggi verifica apertura guidata
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-readiness-panel.yml"
      - "scripts/fix_readiness_panel.py"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix_readiness_panel.py
      - name: Verifica sintattica e contenuti
        run: |
          grep -q "API autenticata raggiungibile" index.html
          grep -q "GESTISCI REGOLARITÀ" index.html
          grep -q "GESTISCI CHECKLIST MIM" index.html
          grep -q "technicalTestPassed" index.html
          if grep -q "fetch('https://elezioni-primo-levi-vercel.vercel.app/api/health'" index.html; then exit 1; fi
          if grep -q "vendor/tailwindcss.js https://cdnjs.cloudflare.com" index.html; then exit 1; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html
          git diff --cached --quiet && exit 0
          git commit -m "Corregge falso errore backend e semplifica gate apertura"
          git push
