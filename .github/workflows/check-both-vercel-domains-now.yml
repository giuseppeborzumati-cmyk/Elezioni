name: Verifica entrambi i domini Vercel
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/check-both-vercel-domains-now.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla domini
        run: |
          for BASE in https://elezioni-primo-levi-vercel.vercel.app https://votazione-levi.vercel.app; do
            echo "=== $BASE ==="
            ROOT=$(curl -sS -o /tmp/root.txt -w "%{http_code}" --max-time 20 "$BASE/" || true)
            HEALTH=$(curl -sS -o /tmp/health.txt -w "%{http_code}" --max-time 20 "$BASE/api/health" || true)
            echo "root=$ROOT health=$HEALTH"
            echo "ROOT_BODY:"; head -c 220 /tmp/root.txt || true; echo
            echo "HEALTH_BODY:"; head -c 500 /tmp/health.txt || true; echo
          done
