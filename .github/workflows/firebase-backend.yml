name: Deploy backend Firebase (manuale)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix functions
      - run: npm run check --prefix functions
      - name: Prepara credenziale temporanea
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MIO_SISTEMA_VOTO }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Secret FIREBASE_SERVICE_ACCOUNT_MIO_SISTEMA_VOTO mancante" >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
      - run: npm install -g firebase-tools
      - name: Deploy Functions e Firestore Rules
        run: firebase deploy --project mio-sistema-voto --only functions,firestore:rules --non-interactive
