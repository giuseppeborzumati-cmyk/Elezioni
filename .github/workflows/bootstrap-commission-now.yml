name: Bootstrap Commissione una tantum

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bootstrap-commission-now.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installa dipendenze Functions
        run: npm install --prefix functions
      - name: Prepara credenziale Firebase temporanea
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MIO_SISTEMA_VOTO }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          chmod 600 "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
      - name: Crea account Commissione se assente
        run: node functions/scripts/bootstrap-commission.js
      - name: Elimina credenziale temporanea dal runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
