name: Aggiungi modalità collaudo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-collaudo-mode.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Applica patch
        run: python3 scripts/add_collaudo_mode.py
      - name: Verifica patch
        run: |
          grep -q "Versione di Prova / Collaudo" index.html
          grep -q "PROVA-STUDENTE-1A" index.html
          grep -q "modalitaProva" index.html
      - name: Salva modifica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html
          git commit -m "Aggiunge modalità prova e collaudo sicuro" || exit 0
          git push
