name: Applica sicurezza credenziale Commissione

on:
  push:
    branches: ["main"]
    paths:
      - ".github/scripts/apply_commission_password_rotation.py"
      - ".github/workflows/apply-commission-password-rotation.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Applica cambio password obbligatorio
        run: python3 .github/scripts/apply_commission_password_rotation.py
      - name: Verifica backend
        run: node --check functions/index.js
      - name: Verifica frontend
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          start=t.find('<script type="module">')
          if start < 0: raise SystemExit('Modulo JS non trovato')
          start += len('<script type="module">')
          end=t.find('</script>', start)
          if end < 0: raise SystemExit('Chiusura modulo non trovata')
          Path('/tmp/frontend.mjs').write_text(t[start:end], encoding='utf-8')
          PY
          node --check /tmp/frontend.mjs
          grep -q "changeCommissionPassword" index.html
          grep -q "mustChangePassword" functions/index.js
      - name: Commit su main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html functions/index.js
          git commit -m "Rende obbligatorio il cambio password iniziale Commissione"
          git push origin main
