name: Verifica votazione-levi live
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/check-votazione-levi-live.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica dominio del progetto esatto votazione-levi
        run: |
          set -e
          BASE="https://votazione-levi.vercel.app"
          for i in {1..18}; do
            ROOT=$(curl -sS -o /tmp/root.html -w "%{http_code}" --max-time 20 "$BASE/" || true)
            HEALTH=$(curl -sS -o /tmp/health.txt -w "%{http_code}" --max-time 20 "$BASE/api/health" || true)
            echo "tentativo=$i root=$ROOT health=$HEALTH"
            if [ "$ROOT" = "200" ] && [ "$HEALTH" = "200" ]; then
              echo "ROOT_OK"
              head -c 160 /tmp/root.html || true
              echo
              echo "HEALTH_OK"
              cat /tmp/health.txt || true
              exit 0
            fi
            sleep 5
          done
          echo "ROOT:"; cat /tmp/root.html || true
          echo "HEALTH:"; cat /tmp/health.txt || true
          exit 1
