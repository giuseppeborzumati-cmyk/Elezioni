name: Applica formula ex aequo
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-exaequo-formula.yml"
      - "scripts/apply_exaequo_formula.py"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica formula e rimuove spareggi alfabetici
        run: python3 scripts/apply_exaequo_formula.py
      - name: Verifica obbligatoria
        run: |
          grep -q "EX_AEQUO_CP = 2147483647" index.html
          grep -q "S_seed = (Σ ASCII(Carattere_i)) mod C_p" index.html
          grep -q "drawExAequo" index.html
          grep -q "sortQuotientsWithExAequo" index.html
          if grep -q "Criterio alfabetico applicato" index.html; then exit 1; fi
          if grep -Eq "if[[:space:]]*\(b\.count[[:space:]]*===[[:space:]]*a\.count\).*localeCompare" index.html; then exit 1; fi
          if grep -q "return a.listName.localeCompare(b.listName)" index.html; then exit 1; fi
      - name: Commit correzione
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html
          git diff --cached --quiet && exit 0
          git commit -m "Applica sorteggio ex aequo con formula ASCII senza criterio alfabetico"
          git push
